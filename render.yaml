# Despliegue en Render (Blueprint) de los tres servicios de parches-ciclovida/:
#   1. parches-backend  API FastAPI, bot de Telegram y el reloj de la semana
#   2. parches-app      la app Flutter compilada para web (sitio estático)
#   3. parches-tablero  el tablero de la Secretaría (sitio estático)
#
# La base es SQLite en el disco del servicio: se borra en cada despliegue o reinicio, y cuando el
# plan gratis duerme el backend. Es una demo: al arrancar vacía se cargan los jóvenes simulados.
services:
  - type: web
    name: parches-backend
    runtime: python
    plan: free
    region: virginia
    rootDir: parches-ciclovida/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: SEMBRAR_AL_INICIAR
        value: "1"
      - key: SECRETO
        generateValue: true
      # Vacía = dedsec-demo, la que trae la app para el chip "Demo" y Ajustes > Herramientas de demo.
      - key: ADMIN_KEY
        sync: false
      # Opcional. Un token solo puede usarlo un backend a la vez: apaga el bot en los computadores.
      - key: TELEGRAM_TOKEN
        sync: false
      # Opcional. Sin ella, el bot y los simulados del chat responden con mensajes fijos.
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: parches-app
    runtime: static
    rootDir: parches-ciclovida/app
    buildCommand: bash tool/render_build.sh
    staticPublishPath: build/web
    envVars:
      # URL pública de parches-backend. Vacía = https://parches-backend.onrender.com
      - key: API_URL
        sync: false
      - key: FLUTTER_VERSION
        value: "3.38.9"
    headers:
      # main.dart.js no cambia de nombre entre versiones: sin caché, cada despliegue se ve de una
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: parches-tablero
    runtime: static
    rootDir: parches-ciclovida/backend/static/tablero
    buildCommand: >-
      echo "window.PARCHES_API = '${API_URL:-https://parches-backend.onrender.com}'; window.PARCHES_APP = '${APP_URL:-https://parches-app.onrender.com}';" > config.js
    staticPublishPath: ./
    envVars:
      # URL pública de parches-backend. Vacía = https://parches-backend.onrender.com
      - key: API_URL
        sync: false
      # URL pública de parches-app (el botón "Abrir la app"). Vacía = https://parches-app.onrender.com
      - key: APP_URL
        sync: false
    headers:
      # app.js y config.js no cambian de nombre: sin caché, cada despliegue se ve de una
      - path: /*
        name: Cache-Control
        value: no-cache
