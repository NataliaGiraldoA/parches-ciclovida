<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sal en parche a la CicloVida de Cali: grupos de estudiantes universitarios verificados que van juntos cada domingo.">
  <meta name="theme-color" content="#20784E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Parches CicloVida">
  <!-- iOS redondea el ícono solo: va el cuadrado completo, sin esquinas transparentes -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Parches CicloVida</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F7F3E5; }
    /* Mientras Flutter arranca: los anillos del logo, en vez de una página en blanco */
    #carga { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #carga img { width: 96px; height: 96px; animation: latir 1.4s ease-in-out infinite; }
    @keyframes latir { 50% { transform: scale(0.92); opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { #carga img { animation: none; } }
  </style>
</head>
<body>
  <div id="carga" aria-label="Cargando Parches CicloVida" role="img"><img src="icons/carga.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (carga) carga.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
